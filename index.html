<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Para você ♥</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #151822 0%, #090b10 68%, #040508 100%);
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      color: #f4d3df;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px 30px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.7;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .terminal-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 999px;
      color: #9aa4b8;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .controls {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d6deeb;
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(6px);
    }

    button:hover {
      background: rgba(255, 130, 175, 0.18);
      border-color: rgba(255, 130, 175, 0.45);
      color: #fff;
    }

    .caption {
      text-align: center;
      max-width: 90vw;
      animation: fadeIn 1.6s ease;
    }

    .caption .main-msg {
      font-size: clamp(15px, 2.6vw, 20px);
      font-weight: 500;
      color: #ff9ec0;
      text-shadow: 0 0 18px rgba(255, 110, 165, 0.45);
      letter-spacing: 0.05em;
    }

    .caption .sub-msg {
      margin-top: 6px;
      font-size: clamp(11px, 1.9vw, 13px);
      color: rgba(214, 222, 235, 0.55);
      letter-spacing: 0.03em;
    }

    /* Modal discreto para personalizar mensagem e copiar link */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 10, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #111520;
      border: 1px solid rgba(255, 158, 192, 0.25);
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .modal h2 {
      font-size: 15px;
      color: #ff9ec0;
      margin-bottom: 14px;
    }

    .modal label {
      display: block;
      font-size: 11px;
      color: #9aa4b8;
      margin-bottom: 5px;
    }

    .modal input {
      width: 100%;
      background: #090b10;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 14px;
      outline: none;
    }

    .modal input:focus {
      border-color: #ff9ec0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-primary {
      background: rgba(255, 110, 165, 0.25);
      border-color: #ff85b3;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="overlay">
    <div class="top-bar">
      <div class="terminal-badge">
        <span class="dot" style="background:#ff5f56"></span>
        <span class="dot" style="background:#ffbd2e"></span>
        <span class="dot" style="background:#27c93f"></span>
        <span>bouquet3d.exe — 60fps</span>
      </div>
      <div class="controls">
        <button id="toggleSpin" title="Pausar/Retomar rotação">⏸ Pausar</button>
        <button id="openEdit" title="Personalizar texto e link">✎ Personalizar</button>
      </div>
    </div>

    <div class="caption">
      <div class="main-msg" id="mainMsg">for you ♥</div>
      <div class="sub-msg" id="subMsg">arraste para girar • feito em código para você</div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2>Personalizar dedicatória</h2>
      <label for="inputMain">Mensagem principal</label>
      <input type="text" id="inputMain" maxlength="60" placeholder="Ex: para o amor da minha vida ♥" />
      <label for="inputSub">Subtítulo / assinatura</label>
      <input type="text" id="inputSub" maxlength="80" placeholder="Ex: com amor, Rafa" />
      <div class="modal-actions">
        <button id="closeModal">Fechar</button>
        <button class="btn-primary" id="saveAndCopy">Salvar e Copiar Link</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d", { alpha: false });

    // Lê parâmetros da URL (?m=...&s=...) para links personalizados
    const params = new URLSearchParams(window.location.search);
    const mainMsgEl = document.getElementById("mainMsg");
    const subMsgEl = document.getElementById("subMsg");
    if (params.get("m")) mainMsgEl.textContent = params.get("m");
    if (params.get("s")) subMsgEl.textContent = params.get("s");

    const SHADE_CHARS = ".,-~:;=!*#$@";
    const points = [];
    const sparkles = [];

    function addPoint(x, y, z, nx, ny, nz, r, g, b, isGlow = false) {
      const len = Math.hypot(nx, ny, nz) || 1;
      points.push({
        x, y, z,
        nx: nx / len,
        ny: ny / len,
        nz: nz / len,
        r, g, b,
        isGlow
      });
    }

    function buildBouquet() {
      points.length = 0;

      // Arranjo rico com rosas, girassol, tulipas, peônias e mosquitinhos (gypsophila)
      const flowers = [
        // Rosa vermelha central destaque
        { x: 0.0,  y: -6.8, z:  0.0,  tx:  0.00, tz:  0.00, col: [242, 38, 72],   rad: 3.35, type: "rose" },
        // Girassol dourado à esquerda
        { x: -3.7, y: -5.3, z:  1.7,  tx:  0.26, tz:  0.34, col: [255, 204, 42],  rad: 3.00, type: "sunflower" },
        // Rosa pink à direita
        { x: 3.8,  y: -5.1, z:  1.4,  tx:  0.20, tz: -0.35, col: [255, 102, 168], rad: 3.05, type: "rose" },
        // Tulipa lilás atrás à esquerda
        { x: -2.5, y: -5.8, z: -2.6,  tx: -0.30, tz:  0.24, col: [188, 112, 255], rad: 2.85, type: "tulip" },
        // Rosa creme/champanhe atrás à direita
        { x: 2.6,  y: -5.7, z: -2.5,  tx: -0.28, tz: -0.25, col: [255, 236, 214], rad: 2.85, type: "rose" },
        // Tulipa coral frontal
        { x: -0.9, y: -4.7, z:  3.4,  tx:  0.42, tz:  0.10, col: [255, 86, 98],   rad: 2.75, type: "tulip" },
        // Rosa pêssego frontal direita
        { x: 1.5,  y: -4.8, z:  3.1,  tx:  0.38, tz: -0.18, col: [255, 154, 102], rad: 2.70, type: "rose" },
        // Flor azul-lavanda no fundo
        { x: 0.0,  y: -5.5, z: -3.6,  tx: -0.42, tz:  0.00, col: [120, 175, 255], rad: 2.80, type: "sunflower" },
      ];

      for (const f of flowers) {
        const cxSin = Math.sin(f.tx), cxCos = Math.cos(f.tx);
        const czSin = Math.sin(f.tz), czCos = Math.cos(f.tz);

        const rot = (px, py, pz) => {
          const y1 = py * cxCos - pz * cxSin;
          const z1 = py * cxSin + pz * cxCos;
          const x2 = px * czCos - y1 * czSin;
          const y2 = px * czSin + y1 * czCos;
          return [x2, y2, z1];
        };

        if (f.type === "rose") {
          const stepsT = 68;
          const stepsU = 18;
          for (let i = 0; i < stepsT; i++) {
            const theta = (i / stepsT) * 6.5 * Math.PI;
            const layer = theta / (6.5 * Math.PI);
            for (let j = 0; j < stepsU; j++) {
              const u = j / stepsU;
              const r = f.rad * (0.20 + 0.80 * layer) * Math.sin(u * Math.PI * 0.86);
              const wave = 1.0 + 0.17 * Math.sin(5.0 * theta);
              const px = r * wave * Math.cos(theta);
              const pz = r * wave * Math.sin(theta);
              const py = -1.75 * Math.cos(u * Math.PI * 0.72) + 0.65 * layer;

              const [rx, ry, rz] = rot(px, py, pz);
              const [nx, ny, nz] = rot(Math.cos(theta) * 0.8, -0.65, Math.sin(theta) * 0.8);
              const shade = 0.52 + 0.48 * layer;
              addPoint(
                f.x + rx, f.y + ry, f.z + rz,
                nx, ny, nz,
                f.col[0] * shade, f.col[1] * shade, f.col[2] * shade
              );
            }
          }
        } else if (f.type === "sunflower") {
          // Miolo texturizado
          for (let a = 0; a < 360; a += 12) {
            const rad = (a * Math.PI) / 180;
            for (const rr of [0.25, 0.55, 0.85, 1.08]) {
              const [rx, ry, rz] = rot(rr * Math.cos(rad), -0.45 * (1 - rr * 0.4), rr * Math.sin(rad));
              const [nx, ny, nz] = rot(0, -1, 0);
              addPoint(f.x + rx, f.y + ry, f.z + rz, nx, ny, nz, 125, 68, 22);
            }
          }
          // Dupla camada de pétalas
          const numPetals = 18;
          for (let p = 0; p < numPetals; p++) {
            const ang = (p / numPetals) * Math.PI * 2;
            for (let dStep = 1; dStep <= 13; dStep++) {
              const t = dStep / 13;
              const dist = 0.95 + t * (f.rad - 0.75);
              const halfW = Math.sin(t * Math.PI) * 0.44;
              for (const w of [-halfW, -halfW * 0.5, 0, halfW * 0.5, halfW]) {
                const px = dist * Math.cos(ang) - w * Math.sin(ang);
                const pz = dist * Math.sin(ang) + w * Math.cos(ang);
                const py = 0.28 * (t * t) - 0.1 * Math.cos(t * Math.PI);
                const [rx, ry, rz] = rot(px, py, pz);
                const [nx, ny, nz] = rot(0.25 * Math.cos(ang), -1.0, 0.25 * Math.sin(ang));
                addPoint(f.x + rx, f.y + ry, f.z + rz, nx, ny, nz, f.col[0], f.col[1], f.col[2]);
              }
            }
          }
        } else if (f.type === "tulip") {
          for (let i = 0; i < 48; i++) {
            const theta = (i / 48) * Math.PI * 2;
            const mod = 1.0 + 0.15 * Math.cos(3.0 * theta);
            for (let j = 0; j < 20; j++) {
              const v = j / 19;
              const r = f.rad * 0.74 * Math.sin(v * Math.PI * 0.82) * mod;
              const px = r * Math.cos(theta);
              const pz = r * Math.sin(theta);
              const py = 1.35 - v * 2.95;
              const [rx, ry, rz] = rot(px, py, pz);
              const [nx, ny, nz] = rot(Math.cos(theta), -0.25, Math.sin(theta));
              const grad = 0.75 + 0.25 * (1 - v);
              addPoint(
                f.x + rx, f.y + ry, f.z + rz,
                nx, ny, nz,
                f.col[0] * grad, f.col[1] * grad, f.col[2] * grad
              );
            }
          }
        }

        // Caule curvo até o nó do laço (y = 3.6) e base inferior (y = 7.6)
        const stemSteps = 44;
        for (let s = 0; s <= stemSteps; s++) {
          const t = s / stemSteps;
          let sx, sy, sz;
          if (t <= 0.72) {
            const k = t / 0.72;
            sx = f.x * Math.pow(1 - k, 1.45);
            sz = f.z * Math.pow(1 - k, 1.45);
            sy = f.y + k * (3.6 - f.y);
          } else {
            const k = (t - 0.72) / 0.28;
            sx = -f.x * 0.24 * k;
            sz = -f.z * 0.24 * k;
            sy = 3.6 + k * 4.1;
          }
          for (let ring = 0; ring < 8; ring++) {
            const ang = (ring / 8) * Math.PI * 2;
            addPoint(
              sx + 0.17 * Math.cos(ang),
              sy,
              sz + 0.17 * Math.sin(ang),
              Math.cos(ang), 0, Math.sin(ang),
              62, 188, 86
            );
          }
        }
      }

      // Ramos de mosquitinho (gypsophila) com pontinhos brancos iluminados
      const babyBreathAngles = [0.4, 1.3, 2.2, 3.1, 4.0, 4.9, 5.7];
      for (const ba of babyBreathAngles) {
        for (let b = 0; b < 9; b++) {
          const r = 2.6 + (b % 3) * 0.9;
          const ang = ba + (b - 4) * 0.08;
          const bx = r * Math.cos(ang);
          const bz = r * Math.sin(ang);
          const by = -4.2 - (b % 4) * 0.65;
          addPoint(bx, by, bz, 0, -1, 0, 255, 250, 255, true);
          addPoint(bx + 0.14, by + 0.08, bz, 0, -1, 0, 255, 240, 250, true);
        }
      }

      // Folhagem verde ao redor da borda do buquê
      const leafAngles = [0.15, 0.85, 1.55, 2.25, 2.95, 3.65, 4.35, 5.05, 5.75];
      leafAngles.forEach((la, idx) => {
        const lyBase = -2.3 - (idx % 2) * 0.75;
        for (let u = 1; u <= 18; u++) {
          const uf = u / 18;
          const dist = 1.9 + uf * 4.0;
          const width = Math.sin(uf * Math.PI) * 1.25;
          for (let ws = -5; ws <= 5; ws++) {
            const wf = (ws / 5) * width;
            const lx = dist * Math.cos(la) - wf * Math.sin(la);
            const lz = dist * Math.sin(la) + wf * Math.cos(la);
            const ly = lyBase + Math.pow(uf, 1.55) * 1.7 + Math.abs(ws / 5) * 0.25;
            const vein = ws === 0 ? 1.15 : 0.95;
            addPoint(
              lx, ly, lz,
              0.3 * Math.cos(la), -0.92, 0.3 * Math.sin(la),
              70 * vein, 212 * vein, 92 * vein
            );
          }
        }
      });

      // Cone de papel de embrulho translúcido + fita de cetim rosa com laço
      for (let ys = 0; ys < 28; ys++) {
        const v = ys / 27;
        const wy = -2.0 + v * 5.6;
        const wr = 4.9 * (1.0 - 0.77 * v) + 0.14 * Math.sin(v * 18);
        for (let a = 0; a < 360; a += 6) {
          const rad = (a * Math.PI) / 180;
          const isRibbon = v > 0.89;
          const col = isRibbon ? [248, 98, 148] : [195, 206, 224];
          addPoint(
            wr * Math.cos(rad),
            wy,
            wr * Math.sin(rad),
            Math.cos(rad), -0.28, Math.sin(rad),
            col[0], col[1], col[2]
          );
        }
      }

      // Laço frontal da fita (y = 3.6)
      for (let side of [-1, 1]) {
        for (let t = 0; t < 24; t++) {
          const ang = (t / 24) * Math.PI * 2;
          const lx = side * (0.65 + 0.55 * Math.cos(ang));
          const ly = 3.6 + 0.38 * Math.sin(ang);
          const lz = 1.15 + 0.18 * Math.sin(ang);
          addPoint(lx, ly, lz, 0, 0, 1, 255, 115, 165);
        }
      }

      // Partículas de brilho flutuando em volta
      sparkles.length = 0;
      for (let i = 0; i < 42; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = 4.5 + Math.random() * 4.5;
        sparkles.push({
          x: rad * Math.cos(ang),
          y: -8.5 + Math.random() * 14.5,
          z: rad * Math.sin(ang),
          phase: Math.random() * Math.PI * 2,
          speed: 0.02 + Math.random() * 0.03
        });
      }
    }

    buildBouquet();

    // Controle de rotação, arraste e zoom
    let angleY = 0;
    let angleX = 0.08;
    let autoSpin = true;
    let isDragging = false;
    let lastX = 0, lastY = 0;
    let zoom = 1.0;

    canvas.addEventListener("pointerdown", (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      angleY += dx * 0.008;
      angleX = Math.max(-0.45, Math.min(0.55, angleX + dy * 0.006));
    });

    window.addEventListener("pointerup", () => {
      isDragging = false;
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom = Math.max(0.65, Math.min(1.65, zoom - e.deltaY * 0.0008));
    }, { passive: false });

    // Botão Pausar/Girar
    const toggleSpinBtn = document.getElementById("toggleSpin");
    toggleSpinBtn.addEventListener("click", () => {
      autoSpin = !autoSpin;
      toggleSpinBtn.textContent = autoSpin ? "⏸ Pausar" : "▶ Girar";
    });

    // Modal de personalização
    const modal = document.getElementById("modal");
    const inputMain = document.getElementById("inputMain");
    const inputSub = document.getElementById("inputSub");

    document.getElementById("openEdit").addEventListener("click", () => {
      inputMain.value = mainMsgEl.textContent;
      inputSub.value = subMsgEl.textContent;
      modal.classList.add("open");
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      modal.classList.remove("open");
    });

    document.getElementById("saveAndCopy").addEventListener("click", async () => {
      const m = inputMain.value.trim() || "for you ♥";
      const s = inputSub.value.trim() || "feito em código para você";
      mainMsgEl.textContent = m;
      subMsgEl.textContent = s;

      const url = new URL(window.location.href);
      url.searchParams.set("m", m);
      url.searchParams.set("s", s);
      window.history.replaceState({}, "", url);

      try {
        await navigator.clipboard.writeText(url.toString());
        alert("Link personalizado copiado! Agora é só colar no WhatsApp dela ♥");
      } catch {
        alert("Mensagem atualizada! Copie o link da barra de endereço para enviar.");
      }
      modal.classList.remove("open");
    });

    // Ajuste responsivo do Canvas
    let width = 0, height = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // Vetor de luz normalizado
    const lx = -0.42, ly = -0.76, lz = -0.50;
    const lLen = Math.hypot(lx, ly, lz);
    const L = [lx / lLen, ly / lLen, lz / lLen];

    let zbuffer = new Float32Array(0);
    let charBuf = [];
    let colorBuf = [];

    function render(timeMs) {
      // Fundo escuro limpo
      ctx.fillStyle = "#080a10";
      ctx.fillRect(0, 0, width, height);

      // Tamanho dinâmico da célula ASCII (alta densidade)
      const cellH = width < 600 ? 7.5 : 8.5;
      const cellW = cellH * 0.62;
      const cols = Math.floor(width / cellW);
      const rows = Math.floor(height / cellH);
      const totalCells = cols * rows;

      if (zbuffer.length !== totalCells) {
        zbuffer = new Float32Array(totalCells);
        charBuf = new Array(totalCells);
        colorBuf = new Array(totalCells);
      }
      zbuffer.fill(-1e9);
      charBuf.fill(null);

      const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX), sinX = Math.sin(angleX);

      const baseScale = Math.min(width, height) * 1.48 * zoom;
      const camDist = 23.5;

      for (let i = 0; i < points.length; i++) {
        const p = points[i];

        // Rotação Y
        const x1 = p.x * cosY + p.z * sinY;
        const z1 = -p.x * sinY + p.z * cosY;
        const y1 = p.y + 0.5;

        // Rotação X
        const ry = y1 * cosX - z1 * sinX;
        const rz = y1 * sinX + z1 * cosX;
        const rx = x1;

        const invZ = 1.0 / (camDist + rz);
        const sx = width * 0.5 + rx * baseScale * invZ;
        const sy = height * 0.47 + ry * baseScale * invZ;

        const gx = Math.floor(sx / cellW);
        const gy = Math.floor(sy / cellH);

        if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
          const idx = gy * cols + gx;
          if (invZ > zbuffer[idx]) {
            zbuffer[idx] = invZ;

            // Rotaciona normal
            const nx1 = p.nx * cosY + p.nz * sinY;
            const nz1 = -p.nx * sinY + p.nz * cosY;
            const rny = p.ny * cosX - nz1 * sinX;
            const rnz = p.ny * sinX + nz1 * cosX;
            const rnx = nx1;

            let lum = rnx * L[0] + rny * L[1] + rnz * L[2];
            lum = p.isGlow ? 1.0 : Math.max(0.24, Math.min(1.05, 0.48 + 0.65 * lum));

            const charIdx = Math.min(
              SHADE_CHARS.length - 1,
              Math.floor(lum * (SHADE_CHARS.length - 1))
            );
            charBuf[idx] = p.isGlow ? "*" : SHADE_CHARS[charIdx];

            const cr = Math.min(255, Math.floor(p.r * lum));
            const cg = Math.min(255, Math.floor(p.g * lum));
            const cb = Math.min(255, Math.floor(p.b * lum));
            colorBuf[idx] = `rgb(${cr},${cg},${cb})`;
          }
        }
      }

      // Renderiza os caracteres ASCII na tela
      ctx.font = `600 ${cellH}px 'JetBrains Mono', 'Fira Code', Consolas, monospace`;
      ctx.textBaseline = "top";

      for (let r = 0; r < rows; r++) {
        const py = r * cellH;
        const rowOffset = r * cols;
        for (let c = 0; c < cols; c++) {
          const idx = rowOffset + c;
          const ch = charBuf[idx];
          if (ch) {
            ctx.fillStyle = colorBuf[idx];
            ctx.fillText(ch, c * cellW, py);
          }
        }
      }

      // Brilhos suaves ao redor
      for (const sp of sparkles) {
        sp.phase += sp.speed;
        const alpha = 0.25 + 0.55 * Math.sin(sp.phase);
        if (alpha <= 0.1) continue;

        const x1 = sp.x * cosY + sp.z * sinY;
        const z1 = -sp.x * sinY + sp.z * cosY;
        const y1 = sp.y + 0.5;
        const ry = y1 * cosX - z1 * sinX;
        const rz = y1 * sinX + z1 * cosX;

        const invZ = 1.0 / (camDist + rz);
        const sx = width * 0.5 + x1 * baseScale * invZ;
        const sy = height * 0.47 + ry * baseScale * invZ;

        ctx.fillStyle = `rgba(255, 195, 220, ${alpha.toFixed(2)})`;
        ctx.fillText("✦", sx, sy);
      }

      if (autoSpin && !isDragging) {
        angleY += 0.014;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
